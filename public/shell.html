<!doctype html>
<!-- desk page shell. Content is fetched from the local server at run time. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#faf9f5">
<script src="/theme-init.js"></script>
<title>desk</title>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/features" aria-label="desk — features">
    <svg class="mark" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
      <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round">
        <path d="M12 2.6v6.2M12 15.2v6.2M2.6 12h6.2M15.2 12h6.2M5.4 5.4l4.3 4.3M14.3 14.3l4.3 4.3M18.6 5.4l-4.3 4.3M9.7 14.3l-4.3 4.3"/>
      </g>
    </svg>
    <span class="wordmark">desk</span>
  </a>
  <nav aria-label="Workspace sections">
    <ul class="tabs" role="tablist">
      <li><button class="tab" role="tab" data-tab="context" aria-selected="false">Context</button></li>
      <li><button class="tab" role="tab" data-tab="architecture" aria-selected="false">Architecture</button></li>
      <li><button class="tab" role="tab" data-tab="features" aria-selected="false">Features</button></li>
    </ul>
  </nav>
  <div class="topbar-tools">
    <div class="live" id="live" data-state="up" title="Live: watching .desk. Changes made by you or an agent appear here on their own."><i></i><span>Live</span></div>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Theme: auto" title="Theme: auto; follows your system">
      <svg class="theme-icon theme-icon-system" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="5.1" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 2.9a5.1 5.1 0 0 0 0 10.2Z" fill="currentColor"/>
      </svg>
      <svg class="theme-icon theme-icon-light" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <path d="M8 1.4v1.5M8 13.1v1.5M1.4 8h1.5M13.1 8h1.5M3.3 3.3l1.1 1.1M11.6 11.6l1.1 1.1M12.7 3.3l-1.1 1.1M4.4 11.6l-1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <svg class="theme-icon theme-icon-dark" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" focusable="false">
        <path d="M13 9.5A5.3 5.3 0 0 1 6.5 3a5.3 5.3 0 1 0 6.5 6.5Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>
</header>
<main class="viewport">
  <aside class="rail" id="rail" aria-label="Navigation">
    <div class="rail-head">
      <p class="eyebrow" id="rail-label"></p>
      <div class="panel-tools" id="rail-tools"></div>
    </div>
    <div id="rail-body"></div>
  </aside>
  <div class="rail-split" id="rail-split" role="separator" aria-orientation="vertical" aria-label="Resize navigation" aria-valuemin="220" aria-valuemax="560" aria-valuenow="320" tabindex="0" title="Drag to resize the navigation · double-click to reset"></div>
  <div class="work" id="work" data-panel="off">
    <section class="graph-panel" id="graph-panel" aria-label="Ticket graph" hidden>
      <div class="panel-tools panel-tools-floating" id="graph-tools"></div>
      <div class="panel-body" id="graph-body"></div>
    </section>
    <div class="article-panel" id="article-panel">
      <div class="panel-tools article-tools" id="article-tools"></div>
      <div class="article-scroll" id="scroll">
        <article class="article" id="article"></article>
      </div>
    </div>
  </div>
</main>
<script src="/marked.min.js"></script>
<script type="module" src="/app.js"></script>
</body>
</html>
